[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogent"
version = "0.2.0"
description = "nanogent - a small AI agent runtime built from scratch in Python (agent loop, function calling, plugins, tracing, eval)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Li Yaobin", email = "2352757837@qq.com" }]
keywords = ["agent", "ai-agent", "llm", "function-calling", "tool-calling", "plugin-system", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/lilsawe/nanogent"
Repository = "https://github.com/lilsawe/nanogent"
Issues = "https://github.com/lilsawe/nanogent/issues"

[project.scripts]
nanogent = "nanogent.cli:run"
nanogent-eval = "nanogent.eval:main"

[tool.setuptools]
packages = ["nanogent"]

[tool.setuptools.package-data]
"nanogent" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PLW", "ASYNC", "S", "TRY", "BLE"]
ignore = [
    "S101",   # 测试里用 assert 是标准写法
    "S603",   # 需要执行外部进程（execute_python 工具）
    "S607",   # 允许按名字调用可执行文件
    "TRY003", # 异常消息里带上下文是刻意的（便于排查）
    "RUF001", "RUF002", "RUF003",  # 中文注释与文档里的全角标点是有意为之
]

[tool.ruff.lint.per-file-ignores]
# 工具体系的设计是「工具失败也不能让 Agent 崩溃」，因此有意捕获宽泛异常并转成错误字符串
"nanogent/tools.py" = ["BLE001"]
# REPL 不能因为单次调用失败就退出
"nanogent/cli.py" = ["BLE001"]
"tests/*" = ["S101", "SLF001", "BLE001"]
"examples/*" = ["S101", "BLE001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
# Tool 子类声明具体参数签名（便于生成 JSON Schema 与阅读），与基类 **kwargs 的差异是有意为之
disable_error_code = ["override"]

[tool.coverage.run]
source = ["nanogent"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
