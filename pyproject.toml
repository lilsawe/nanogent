[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal AI agent framework built from scratch for learning and interviews."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mini-agent = "mini_agent.cli:run"
mini-agent-eval = "mini_agent.eval:main"

[tool.setuptools]
packages = ["mini_agent"]

[tool.setuptools.package-data]
"mini_agent" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
