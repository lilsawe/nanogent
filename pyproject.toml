[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogent"
version = "0.1.0"
description = "nanogent - a minimal AI Agent Runtime built from scratch in Python (agent loop, function calling, tool registry, tracing, eval)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
nanogent = "nanogent.cli:run"
nanogent-eval = "nanogent.eval:main"

[tool.setuptools]
packages = ["nanogent"]

[tool.setuptools.package-data]
"nanogent" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
